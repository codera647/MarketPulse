[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse"
version = "0.1.0"
description = "Auditable market-data research and synthetic forecast replay demo"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "python-dotenv==1.2.4",
  "pandas-market-calendars>=5,<6",
  "scikit-learn==1.9.1",
  "threadpoolctl==3.7.0",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "streamlit==1.65.0",
  "agent-reach @ git+https://github.com/Panniantong/Agent-Reach.git@94f06c1969dfc1834001269d79d3ad0972d9dee6",
  "trailforge @ git+https://github.com/codera647/Trailforge.git@fbefaf40fb39a1429dcc328184372214f9fd849d",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "httpx==0.28.1"]
research-v2 = ["catboost==1.2.10", "transformers==5.19.0", "torch==2.14.1"]

[project.scripts]
marketpulse = "marketpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
