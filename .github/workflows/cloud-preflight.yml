name: Verify private cloud access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud-preflight.yml'
      - 'deploy/requirements-preflight.txt'
      - 'src/marketpulse/cloud_preflight.py'
      - 'src/marketpulse/cloud_connections.py'

permissions:
  contents: read

concurrency:
  group: marketpulse-cloud-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'codera647/MarketPulse' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install bounded access-check dependencies (without credentials)
        run: |
          python -m pip install -r deploy/requirements-preflight.txt
          python -m pip check
      - name: Read-only exact-target checks
        run: python -m marketpulse.cloud_preflight
        env:
          PYTHONPATH: src
          MARKETPULSE_DATABASE_URL: ${{ secrets.MARKETPULSE_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Public Actions logs contain only status and key names. No private artifacts uploaded.
