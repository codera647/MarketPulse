name: Release private dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.vercelignore'
      - '.github/workflows/deploy-dashboard.yml'
      - 'deploy/requirements-build.txt'
      - 'src/marketpulse/cloud_deploy.py'
      - 'src/marketpulse/cloud_package.py'
      - 'src/marketpulse/cloud_package_smoke.py'
      - 'scripts/verify_hosted_dashboard.py'

permissions:
  contents: read

concurrency:
  group: marketpulse-private-dashboard-release
  cancel-in-progress: false

env:
  PYTHONPATH: src
  VERCEL_ORG_ID: team_75Ikyytg6OGvW0iRj2fKq0Gg
  VERCEL_PROJECT_ID: prj_Gto0aVFyeStSCSyOezczGk8myTWx

jobs:
  verify:
    if: github.repository == 'codera647/MarketPulse' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install bounded test dependencies (no production credentials)
        run: |
          python -m pip install -r deploy/requirements-preflight.txt -r web/requirements.txt -r deploy/requirements-cloud-tests.txt
          python -m pip check
      - name: Verify cloud and hosted contracts
        run: python -m pytest -q tests/test_cloud_bootstrap.py tests/test_cloud_connections.py tests/test_cloud_state.py tests/test_cloud_preflight.py tests/test_cloud_dashboard.py tests/test_cloud_deploy.py tests/test_cloud_package.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned standalone build tools (no production credentials)
        run: |
          npm install --global vercel@63.1.2
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r deploy/requirements-build.txt
      - name: Reproduce real standalone package on Linux before production approval
        run: python -m marketpulse.cloud_package_smoke

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install reviewed CLI and verification dependencies
        run: |
          npm install --global vercel@63.1.2
          python -m pip install -r deploy/requirements-preflight.txt
      - name: Install and verify pinned Python build tool (without credentials)
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r deploy/requirements-build.txt
          uv --version
          python -c "import shutil, subprocess; tool = shutil.which('uv'); assert tool, 'uv is missing from PATH'; version = subprocess.check_output([tool, '--version'], text=True).split(); assert version[:2] == ['uv', '0.10.11'], 'unexpected uv build tool version'"
      - name: Verify private target and prepare public project link
        run: python -m marketpulse.cloud_deploy --prepare
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Pull exact production project settings
        # --scope performs a user-level lookup denied to project-scoped tokens.
        # The verified link and exact VERCEL_ORG_ID/PROJECT_ID select the target.
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build the isolated web runtime
        run: vercel build --prod --standalone
      - name: Verify standalone package before any upload (without credentials)
        run: python -m marketpulse.cloud_package
      - name: Stage reviewed production artifact
        id: stage
        run: python -m marketpulse.cloud_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify private HTTP and real data boundaries
        run: python scripts/verify_hosted_dashboard.py --url "$DEPLOYMENT_URL"
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Promote the tested production artifact without rebuilding
        run: python -m marketpulse.cloud_deploy --promote
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Never upload .vercel env/build state, protected response data or credentials as artifacts.
